$('help').onclick=()=>intro(true);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)intro(true)});let previous=0;function frame(t){let dt=Math.min((t-previous)/1000,.04);previous=t;if(!paused){const n=Math.max(1,Math.ceil(dt/.006));for(let i=0;i<n;i++)step(dt/n)}draw();requestAnimationFrame(frame)}intro();sync();requestAnimationFrame(frame);
</script></body></html>
